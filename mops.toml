[package]
name = "ic402"
version = "2.9.0"
description = "Drop-in payment library for ICP canisters. x402 charges, MPP-style sessions, ERC-8004 agent identity."
repository = "https://github.com/vhew/ic402"
license = "Apache-2.0"
keywords = [
  "payment",
  "x402",
  "evm",
  "icrc2",
  "micropayment",
  "session",
  "eip-3009",
  "erc-8004"
]
files = [ "src/ic402/**/*.mo" ]

[dependencies]
base = "0.16.0"
ic = "4.2.0"
cbor = "4.1.0"
ed25519 = "0.1.0"
sha2 = "0.2.5"
sha3 = "0.1.1"
ecdsa = "8.0.1"
hmac = "1.1.0"
chacha = "1.0.1"

[dev-dependencies]
test = "2.1.2"

[toolchain]
moc = "1.9.0"
# wasmtime pinned to 44.0.0 for the wasi-mode tests (test/candid-mirrors.test.mo): mops
# passes -Spreview2=n; wasmtime 45 prints a deprecation warning on stderr, which mops
# treats as a test failure, and wasmtime >=47 (2026-07-20) makes the flag a hard error.
# Revisit when mops stops passing the flag.
wasmtime = "44.0.0"
