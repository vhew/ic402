# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v0.2.2/docs/schemas/icp-yaml-schema.json
#
# ic402 — example canister + local dev ledgers.

canisters:
  - name: example
    recipe:
      type: '@dfinity/motoko@v4.1.0'
      configuration:
        main: example/main.mo
        candid: example/example.did
        args: ''

  - name: ckusdc_ledger
    recipe:
      type: '@dfinity/prebuilt@v2.0.0'
      configuration:
        path: .icp/icrc1-ledger.wasm.gz
        candid: .icp/icrc1-ledger.did
    init_args:
      path: .icp/ckusdc-ledger-init.candid
      format: candid

  - name: evm_rpc
    recipe:
      type: '@dfinity/prebuilt@v2.0.0'
      configuration:
        path: .icp/evm_rpc.wasm.gz
        candid: .icp/evm_rpc.did
    init_args:
      path: .icp/evm-rpc-init.candid
      format: candid

  - name: zk_verifier
    recipe:
      type: '@dfinity/prebuilt@v2.0.0'
      configuration:
        path: example/zk-verifier/prebuilt/zk_verifier.wasm.gz
        candid: example/zk-verifier/zk_verifier.did

  # TEST FIXTURE ONLY (production-readiness item B3): a scriptable mock of the
  # DFINITY EVM RPC canister so CI can exercise the EVM-outbound state machine
  # (sign → broadcast → confirm / park / reconcile) on a local replica — no funded
  # testnet, no HTTPS outcalls. Local-only; deliberately absent from the `ic` env.
  - name: evm_rpc_mock
    recipe:
      type: '@dfinity/motoko@v4.1.0'
      configuration:
        main: example/evm-rpc-mock/main.mo
        candid: example/evm-rpc-mock/evm_rpc_mock.did
        args: ''

networks:
  - name: local
    mode: managed
    gateway:
      port: 4944

  - name: mainnet
    mode: connected
    url: https://icp-api.io
    # REQUIRED by icp-cli >= 1.1.0 for connected networks (previously an implicit default).
    # This is the canonical IC mainnet root key (matches @icp-sdk/core's IC_ROOT_KEY), spelled
    # as HEX rather than 1.1.0's "mainnet" keyword so that icp-cli 1.0.x — which knows the
    # field but hex-decodes it — still parses this manifest. Responses from the URL above are
    # verified against this key.
    root-key: 308182301d060d2b0601040182dc7c0503010201060c2b0601040182dc7c05030201036100814c0e6ec71fab583b08bd81373c255c3c371b2e84863c98a4f1e08b74235d14fb5d9c0cd546d9685f913a0c0b2cc5341583bf4b4392e467db96d65b9bb4cb717112f8472e0d5a4d14505ffd7484b01291091c5f87b98883463f98091a0baaae

environments:
  - name: local
    network: local
    canisters: [example, ckusdc_ledger, evm_rpc, zk_verifier, evm_rpc_mock]

  - name: ic
    network: mainnet
    canisters: [example]
