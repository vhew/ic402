# Automated dependency updates. Every PR runs through the full CI (12 jobs incl. mops test,
# replica-backed integration, stable-compat, wasm-locals), so a regressing bump fails the gate
# rather than shipping. NOTE: Dependabot does not support the mops (Motoko) ecosystem — mo:*
# deps (mo:sha2, mo:ic, mo:ecdsa, ...) still bump by hand.
version: 2
updates:
  # npm / pnpm workspace — the root pnpm-lock.yaml covers packages/*, integrations/*, example/client.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # ICP packages arrive as their own PR (a dependency is placed in the FIRST group it matches),
      # so an @icp-sdk bump is reviewed on its own rather than riding with eslint/prettier.
      icp-sdk:
        patterns: ['@icp-sdk/*']
      # Batch minor+patch into one PR to cut noise; majors get their own PR to review deliberately.
      npm-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      # The icp CLI is also installed globally in ci.yml at a PINNED version (see the note there);
      # a devDependency-only bump would split the two. Bump both deliberately, by hand.
      - dependency-name: '@icp-sdk/icp-cli'

  # GitHub Actions pinned in the CI + release workflows (actions/checkout, setup-node, setup-mops, ...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        update-types: ['minor', 'patch']
    ignore:
      # v6+ bootstraps pnpm 11 and was red on our pnpm 9 (PR #5). Revisit with the pnpm 10/11 move.
      - dependency-name: 'pnpm/action-setup'
        versions: ['>= 6']
