name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:client

  test-motoko:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ZenVoich/setup-mops@v1
      - run: mops install
      - run: mops test

  # Guard the library's stable types: a breaking change to any Stable*State (which would brick a
  # consumer's upgrade) fails here unless STABLE_SCHEMA_VERSION is bumped + the baseline advanced.
  # The self-test proves the gate still discriminates (a future moc/flag change can't silently
  # neuter it into a green no-op).
  stable-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ZenVoich/setup-mops@v1
      - run: mops install
      - run: ./scripts/check-stable-compat.sh
      - run: ./scripts/check-stable-compat.sh --self-test

  # Guard the Motoko mirrors of EXTERNAL canister interfaces (ICRC-1/2 ledger in Types.mo,
  # EVM-RPC in EvmRpc.mo): a mirror that drifts decode-unsafe from the official .did traps
  # mid-settle at runtime (bit the repo twice). Probe actors -> moc --idl -> pinned didc
  # subtype-check against vendored official .dids (test/fixtures/official/, hermetic).
  # The self-test proves the gate still discriminates (a didc upgrade or argument-order
  # regression can't silently neuter it into a green no-op).
  candid-mirrors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ZenVoich/setup-mops@v1
      - run: mops install
      - run: ./scripts/check-candid-mirrors.sh
      - run: ./scripts/check-candid-mirrors.sh --self-test

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:client
      - run: pnpm test:client

  # Root vitest: SDK integration + MCP SSRF (security.ts) + MCP guards (guards.ts).
  # The MCP tests import the source modules directly; integration tests skip (pass)
  # without a local replica.
  test-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:client
      - run: pnpm exec vitest run

  # Type-check the MCP server and the demo client (catches wiring regressions in the
  # extracted security/guards modules and the demo's MCP integration).
  build-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:demo

  # S19/S20: fail the build if example/main.mo's mainnet markers drift from what
  # scripts/patch-local.sh rewrites (a drifted pattern silently no-ops, shipping a
  # local build with mainnet values).
  verify-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-patch-patterns.sh
      # The session-expiry sweep DISARMS itself when no session state remains, which is only safe
      # while every session-creating path arms it back. A missed arm site is silent (sessions
      # never expire) and cannot be unit-tested — `mops test` has no timer system API — so the
      # invariant is enforced against the source here. The self-test proves the gate still
      # discriminates rather than having decayed into a green no-op.
      - run: bash scripts/check-expiry-arm-sites.sh
      - run: bash scripts/check-expiry-arm-sites.sh --self-test

  # B0: the example canister must stay INSTALLABLE on the IC. moc unrolls SHA-256
  # (mo:sha2) into >2000 Wasm locals in one function, over the IC's per-function install
  # limit (IC0505), so the build MUST run wasm-opt to coalesce them. This gate compiles +
  # optimizes the example and fails if any function exceeds the locals budget — catching an
  # un-installable wasm here instead of at a mainnet deploy, without needing a replica.
  wasm-locals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ZenVoich/setup-mops@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mops install
      - run: bash scripts/build-example.sh /tmp/example.wasm

  # B4: the integration suite (test/integration.test.ts, 50 cases) exercises the canister
  # END-TO-END, but every case is gated `if (skip) return` and SILENTLY PASSES (counts as passed,
  # not skipped) when no replica is reachable — so the plain `test-ts` vitest run can't catch a
  # money-path regression. This job deploys a REAL local replica via `pnpm setup:local` and runs
  # the suite with IC402_REQUIRE_REPLICA=1, which turns a missing replica into a HARD failure
  # (test/integration.test.ts:52-55). Determinism: the suite binds to its own registered service
  # id and is hermetic (every fetch hits the local replica; the EVM cases are sign-only, no
  # broadcast). No Rust toolchain needed — the zk-verifier prebuilt is committed (setup only
  # builds it when missing); binaryen for wasm-opt is fetched (SHA-pinned, Linux/x86_64).
  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: ZenVoich/setup-mops@v1
      - name: Install icp CLI
        # PINNED: unpinned @latest broke CI when 1.1.0 (2026-07-15) made `root-key` required
        # for connected networks (icp.yaml carries it as hex so 1.0.x parses too). Bump
        # deliberately, with a local `icp canister status`/predemo check on the new version.
        run: npm install -g @icp-sdk/icp-cli@1.1.0
      - run: pnpm install --frozen-lockfile
      - name: Deploy local replica + canisters
        run: pnpm setup:local
      # setup:local adds test-payer as a controller + funds it, but does NOT export the PEM the
      # suite loads (test/helpers.ts → .local/test-payer.pem). predemo exports it (and re-confirms
      # controller + funding + ICRC-2 approval). Without it the suite falls back to an ANONYMOUS
      # identity and every controller-gated method (content/service/policy/sign) traps — 24/50.
      - name: Prepare test identity (export test-payer PEM + funding)
        run: bash scripts/predemo.sh
      - name: Integration suite (replica-enforced)
        run: IC402_REQUIRE_REPLICA=1 pnpm test:integration

  # B3: gate the EVM-OUTBOUND rail (sign → broadcast → confirm / park / reconcile) HERMETICALLY —
  # no funded testnet, no HTTPS outcall. setup:local deploys the replica + example; predemo exports
  # the (controller) test-payer PEM; setup-evm-outbound.sh deploys a SCRIPTABLE mock of the EVM-RPC
  # canister and re-points the example at it. The suite then forces confirmed / reverted / never-mined
  # / pending-then-mined / inconsistent-fee outcomes — including ones a real testnet won't produce on
  # demand — while the canister still does REAL tECDSA signing + RLP (only the broadcast/confirm is
  # mocked). IC402_REQUIRE_EVM_OUTBOUND=1 turns a missing fixture into a HARD failure (it is its own
  # flag, not IC402_REQUIRE_REPLICA, because the example must be re-pointed at the mock first).
  test-evm-outbound:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: ZenVoich/setup-mops@v1
      - name: Install icp CLI
        # PINNED: unpinned @latest broke CI when 1.1.0 (2026-07-15) made `root-key` required
        # for connected networks (icp.yaml carries it as hex so 1.0.x parses too). Bump
        # deliberately, with a local `icp canister status`/predemo check on the new version.
        run: npm install -g @icp-sdk/icp-cli@1.1.0
      - run: pnpm install --frozen-lockfile
      - name: Deploy local replica + canisters
        run: pnpm setup:local
      - name: Prepare test identity (export test-payer PEM + funding)
        run: bash scripts/predemo.sh
      - name: Overlay the EVM-RPC mock fixture (re-point example → mock)
        run: bash scripts/setup-evm-outbound.sh
      - name: EVM-outbound suite (fixture-enforced)
        run: IC402_REQUIRE_EVM_OUTBOUND=1 pnpm exec vitest run test/evm-outbound.test.ts

  # Keep example/example.did in sync with example/main.mo — a drifted .did ships a stale Candid
  # interface (and the @ic402/client + MCP IDL are mirrored from it). Regenerate and fail on a diff.
  did-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ZenVoich/setup-mops@v1
      - run: mops install
      - run: bash scripts/gen-did.sh
      - name: Fail if example.did is stale (run scripts/gen-did.sh and commit)
        run: git diff --exit-code example/example.did
