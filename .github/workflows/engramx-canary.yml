name: EngramX canary

# Protects the flagship consumer: type-checks EngramX (which pins `ic402`) against THIS repo's HEAD,
# so an ic402 change that breaks EngramX's build fails HERE — before it's released.
#
# Mechanism (verified against the real repos): EngramX imports `mo:ic402/ic402/*`; mops resolves a
# sibling local-path dep; `moc --check` compiles each EngramX actor (and everything it imports)
# against the overridden ic402. It checks EngramX's default branch.
#
# Type-check, not `mops test`: EngramX's full suite got this runner killed mid-run (exit 143,
# "runner has received a shutdown signal") on every run from 2026-08-14, whatever ic402 changed,
# so the gate was dark. API and type breaks — what this canary exists for — surface at compile time.
#
# EngramX is currently PRIVATE, so the checkout uses ENGRAMX_READ_TOKEN (a read-only token/deploy
# key, scoped to the `canary` environment — which must have NO branch restriction, or PR runs are
# blocked). When EngramX goes public: drop the token, the `environment:` line, and the fork guard.
# Fork PRs are skipped (GitHub withholds secrets from them) rather than failing.
#
# TODO before first run: confirm the EngramX repo path below (owner/name).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 7 * * *' # nightly drift check
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  engramx-canary:
    # Skip Dependabot (its PRs bump npm/actions, never ic402's Motoko surface, and can't read the
    # token anyway) and fork PRs (GitHub withholds secrets from them).
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: canary # scopes ENGRAMX_READ_TOKEN to this job
    steps:
      - name: Checkout ic402 (HEAD under test)
        uses: actions/checkout@v7
        with:
          path: ic402

      - name: Checkout EngramX (private, read-only)
        uses: actions/checkout@v7
        with:
          repository: vhew/engramx # <-- confirm the real owner/name
          token: ${{ secrets.ENGRAMX_READ_TOKEN }}
          path: engramx

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - uses: caffeinelabs/setup-mops@v1 # moved from ZenVoich/setup-mops (same commit)
        with:
          mops-version: 3.4.2 # PINNED — see the note on ci.yml's first setup-mops step

      # Repoint EngramX's ic402 dep from the pinned registry version to this checkout (siblings:
      # ./ic402 and ./engramx). Matches the verified local rehearsal.
      - name: Point EngramX at ic402 HEAD
        run: |
          sed -i 's#^ic402 = .*#ic402 = "../ic402"#' engramx/mops.toml
          # The override changes the deps hash, so EngramX's committed mops.lock no longer matches
          # (mops fails the integrity check in CI). Drop it — `mops install` regenerates a fresh lock.
          rm -f engramx/mops.lock
          echo "override: $(grep '^ic402' engramx/mops.toml)"

      - name: Type-check EngramX's actors against ic402 HEAD
        working-directory: engramx
        run: |
          mops install
          # EngramX's own pinned moc if it declares one, else ic402's.
          MOC="$(mops toolchain bin moc 2>/dev/null || (cd ../ic402 && mops toolchain bin moc))"
          ACTORS="$(git ls-files '*.mo' | grep -v -E '(^|/)test/' | xargs grep -l -E '^\s*((shared|persistent)[^=]*\s)?actor\b' || true)"
          if [ -z "$ACTORS" ]; then echo "::error::no actor files found in EngramX"; exit 1; fi
          for f in $ACTORS; do
            echo "moc --check $f"
            "$MOC" --check $(mops sources) "$f"
          done
