name: Release

# Publishes ic402 to mops + @ic402/client and @ic402/mcp to npm when a vX.Y.Z tag is pushed.
#
# Flow (see RELEASING.md): bump with scripts/version.sh, commit, `git tag -a vX.Y.Z -m ...`,
# push master, then push the tag — this workflow does the rest. Publishes are IDEMPOTENT: a
# version already on a registry is skipped, so re-running, or a no-change release (e.g. mops/mcp
# unchanged, as in 2.5.3), is safe and won't fail.
#
# npm auth uses TRUSTED PUBLISHING (OIDC) — no NPM_TOKEN, nothing to leak/rotate/OTP. Configure a
# Trusted Publisher on npm for BOTH @ic402/client and @ic402/mcp (npmjs.com → each package →
# Settings → Trusted Publisher): organization `vhew`, repository `ic402`, workflow `release.yml`,
# environment `release`. The job then authenticates via GitHub OIDC (id-token: write) and publishes
# with provenance.
#
# Required ENVIRONMENT secret on the `release` environment (Settings → Environments → release, NOT a
# repository secret, so only this job reads it). Recommended protections on that environment:
# required reviewers + a deployment-tag restriction to `v*`.
#   MOPS_IDENTITY_PEM  - the mops publishing identity PEM (contents of deploy/ic402-mops.pem)

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch: {}

permissions:
  contents: write # create the GitHub Release for the tag
  id-token: write # OIDC for npm Trusted Publishing (no NPM_TOKEN)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The `release` environment gates OIDC trusted publishing + scopes MOPS_IDENTITY_PEM to this
    # job only; add protections (required reviewers, tag restriction to v*) on it in repo settings.
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - uses: ZenVoich/setup-mops@v1
      - run: pnpm install --frozen-lockfile
      - run: mops install
      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1; node 22 ships npm 10.
      # Pinned to the 11.x line: npm 12.0.0 (2026-07-08) ships a broken provenance publish —
      # MODULE_NOT_FOUND 'sigstore' from libnpmpublish/provenance.js (broke the v2.9.0 run);
      # 11.18.0 is the proven-green version from the v2.8.0 release. Revisit once npm 12 fixes it.
      - run: npm install -g npm@11

      # mops.toml is the single source of truth for the version; a tag must match it exactly.
      - name: Guard - tag matches source version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(grep '^version' mops.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')"
          echo "tag=v$TAG  mops.toml=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG does not match mops.toml version $VER"; exit 1
          fi

      # Lean pre-publish re-verify. The tagged commit already passed the full CI on master, but
      # publish is irreversible, so re-confirm the artifacts that actually ship.
      - run: pnpm build:client
      - run: pnpm build:demo
      - run: mops test

      # Create (or update, on re-run) the GitHub Release BEFORE publishing — mops pulls a version's
      # release notes from the GitHub Release, so it must exist first (deploy.sh ordered it the same
      # way). Notes come from this version's CHANGELOG.md section. Tag-triggered only.
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          V="${TAG#v}"
          # Body of the "## v<version> — ..." section, up to the next "## v" heading.
          awk -v h="## v${V} " 'index($0,h)==1{f=1;next} f&&/^## v/{exit} f{print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "no CHANGELOG section for v${V} — using a minimal note"
            printf 'ic402 %s\n' "$TAG" > "$RUNNER_TEMP/notes.md"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --title "ic402 $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Publish @ic402/client to npm
        run: |
          V="$(node -p "require('./packages/client/package.json').version")"
          if npm view "@ic402/client@$V" version >/dev/null 2>&1; then
            echo "@ic402/client@$V already on npm - skipping"
          else
            npm publish ./packages/client --access public
          fi

      - name: Publish @ic402/mcp to npm
        run: |
          V="$(node -p "require('./integrations/mcp/package.json').version")"
          if npm view "@ic402/mcp@$V" version >/dev/null 2>&1; then
            echo "@ic402/mcp@$V already on npm - skipping"
          else
            npm publish ./integrations/mcp --access public
          fi

      - name: Publish ic402 to mops
        env:
          MOPS_IDENTITY_PEM: ${{ secrets.MOPS_IDENTITY_PEM }}
        run: |
          if [ -z "$MOPS_IDENTITY_PEM" ]; then
            echo "::error::MOPS_IDENTITY_PEM secret is not set"; exit 1
          fi
          printf '%s\n' "$MOPS_IDENTITY_PEM" > "$RUNNER_TEMP/mops.pem"
          mops user import --no-encrypt -- "$(cat "$RUNNER_TEMP/mops.pem")"
          rm -f "$RUNNER_TEMP/mops.pem"
          set +e
          OUT="$(mops publish --no-bench 2>&1)"; RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" -ne 0 ] && ! echo "$OUT" | grep -q "already published"; then
            echo "::error::mops publish failed"; exit 1
          fi
